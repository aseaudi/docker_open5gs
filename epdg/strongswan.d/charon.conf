charon {
    # Only EAP-AKA authentication is supported, so we can force it to be used for all EAP authentication requests.
    force_eap_only_authentication = yes
    plugins {
        epdg {
            aaa {
                smf_address = 172.22.0.7
                smf_port = 3868
                origin_host = aaa.epc.mnc001.mcc001.3gppnetwork.org
                origin_realm = epc.mnc001.mcc001.3gppnetwork.org
            }
            diameter {
                server = 172.22.0.18     # HSS IP address (default 127.0.0.1)
                port = 3875             # TCP port (default 3868)
                origin_host = aaa.epc.mnc001.mcc001.3gppnetwork.org
                origin_realm = epc.mnc001.mcc001.3gppnetwork.org
                destination_realm = epc.mnc001.mcc001.3gppnetwork.org
                server_name = sip:epdg.local
                visited_plmn_id = 00f110
            } 
            gtpv2c {
                pgw_address = 172.22.0.7
                pgw_port = 2123
                local_address = 172.22.0.41
                gtpu_local_address = 172.22.0.41
                device = gtp0
            }
        }
    }
}
